
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register New Staff</title>

    <style>
        body {
            font-family: "Times New Roman", serif;
            margin: 40px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 80px;
        }

        .form-group {
            margin-bottom: 25px;
            display: flex;
            align-items: center;
        }

        label {
            width: 310px;
            font-size: 28px;
        }

        input,
        select {
            width: 440px;
            height: 45px;
            font-size: 22px;
            padding: 5px;
            box-sizing: border-box;
        }

        .designation-other {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .designation-other select {
            width: 345px;
        }

        .designation-other input {
            width: 440px;
        }

        .buttons {
            margin-top: 25px;
            margin-left: 0;
        }

        button {
            font-size: 22px;
            padding: 8px 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Register new Staff</h1>

    <form>

        <!-- Username -->
        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" name=placeholder"username">
        </div>

        <!-- Password -->
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password">
        </div>

        <!-- Full Name -->
        <div class="form-group">
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname">
        </div>

        <!-- Email -->
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
        </div>

        <!-- Phone Number -->
        <div class="form-group">
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone">
        </div>

        <!-- Address -->
        <div class="form-group">
            <label for="address">Address:</label>
            <input type="text" id="address" name="address">
        </div>

        <!-- Designation -->
        <div class="form-group">
            <label for="designation">Designation:</label>

            <div class="designation-other">
                <select id="designation" name="designation">
                    <option value="General Manager">General Manager</option>
                    <option value="Sales Executive">Sales Executive</option>
                    <option value="Secretary">Secretary</option>
                    <option value="Project Supervisor" selected>
                        Project Supervisor
                    </option>
                    <option value="Cleaner">Cleaner</option>
                    <option value="Gate Keeper">Gate Keeper</option>
                </select>

                <span style="font-size: 28px;">Other:</span>

                <input type="text" name="other_designation">
            </div>
        </div>

        <!-- Department -->
        <div class="form-group">
            <label for="department">Department:</label>

            <select id="department" name="department">
                <option value="Management">Management</option>
                <option value="Logistic Department">Logistic Department</option>
                <option value="Procurement Department">
                    Procurement Department
                </option>
                <option value="Information Technology" selected>
                    Information Technology
                </option>
                <option value="Security Department">
                    Security Department
                </option>
                <option value="Operational Department">
                    Operational Department
                </option>
                <option value="Research Department">
                    Research Department
                </option>
                <option value="Legal Department">
                    Legal Department
                </option>
                <option value="Finance">Finance</option>
                <option value="Others">Others</option>
            </select>
        </div>

        <!-- Hotel Branch -->
        <div class="form-group">
            <label for="hotel_branch">Hotel Branch:</label>

            <select id="hotel_branch" name="hotel_branch">
                <option value="Kuto">Kuto</option>
                <option value="Lafenwa">Lafenwa</option>
                <option value="Olomoore">Olomoore</option>
                <option value="Soyoye" selected>Soyoye</option>
                <option value="Panseke">Panseke</option>
                <option value="Itoku">Itoku</option>
            </select>
        </div>

        <!-- Buttons -->
        <div class="buttons">
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </div>

    </form>

</body>
</html>
